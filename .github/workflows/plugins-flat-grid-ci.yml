name: Plugins restructure validation

on:
  push:
    branches:
      - plugins-flat-grid
      - native-browser-back-20261103
      - sidebar-order-20261103
    paths:
      - "src/**"
      - "control-center-app/**"
      - "control-center/data/catalog.json"
      - "src/styles.css"
      - "vite.config.js"
      - "scripts/test-plugins-restructure.mjs"
      - ".github/workflows/plugins-flat-grid-ci.yml"

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Control Center
        run: npm run build
      - name: Run Plugins integrity tests
        run: node scripts/test-plugins-restructure.mjs
      - name: Commit verified build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/assets control-center/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh verified Control Center assets"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
