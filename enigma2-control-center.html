<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070c18">
  <link rel="icon" type="image/png" href="assets/byromeh-logo.png" />
  <meta name="description" content="Online4Tech Enigma2 Control Center">
  <title>Online4Tech | Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  color-scheme:dark;
  --bg:#070c18;--surface:#0e1628;--surface-2:#131e36;--surface-3:#1a2745;
  --line:rgba(150,172,214,.14);--line-strong:rgba(150,172,214,.28);
  --text:#eaf1ff;--muted:#8fa1c0;--faint:#62738f;
  --brand:#3ddcf0;--brand-ink:#04222a;--good:#3ddc97;--warn:#fbbf24;--bad:#ff6b7a;
  --radius:16px;--radius-sm:10px;
  --font:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{margin:0;height:100%}
body{
  overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);
  background-image:radial-gradient(900px 420px at 88% -8%,rgba(92,112,255,.16),transparent 60%),radial-gradient(700px 360px at 6% -4%,rgba(61,220,240,.10),transparent 60%);
  background-attachment:fixed;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- الهيكل: الصفحة ثابتة والقايمة الداخلية بس هي اللي بتسكرول ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,28px);border-bottom:1px solid var(--line);background:rgba(7,12,24,.72);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px;background:linear-gradient(135deg,#3ddcf0,#6d7bff);color:#04121f;box-shadow:0 6px 18px rgba(61,220,240,.22)}
.brand h1{margin:0;font-size:clamp(15px,2.2vw,19px);font-weight:800;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--brand)}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text);transition:.15s}
.pill:hover{border-color:var(--brand);background:var(--surface-2)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill[data-state=online] i{background:var(--good);box-shadow:0 0 0 3px rgba(61,220,148,.18)}
.pill[data-state=offline] i{background:var(--warn)}

.controls{flex:none;padding:14px clamp(14px,3vw,28px) 0;display:grid;gap:10px}
.search{position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);padding:0 44px 0 44px;font-size:14.5px;transition:.15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,220,240,.14)}
.search .ico{position:absolute;inset-block:0;inset-inline-start:15px;display:grid;place-items:center;color:var(--faint);pointer-events:none}
.search .clear{position:absolute;inset-block:0;inset-inline-end:8px;width:32px;display:grid;place-items:center;background:none;border:0;color:var(--muted);font-size:18px}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;transition:.15s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--line-strong)}
.chip img{width:18px;height:18px;opacity:.85}
.chip b{font-weight:700;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(150,172,214,.12);color:var(--muted)}
.chip[aria-pressed=true]{background:linear-gradient(135deg,rgba(61,220,240,.20),rgba(109,123,255,.20));border-color:rgba(61,220,240,.55);color:#fff}
.chip[aria-pressed=true] b{background:rgba(61,220,240,.22);color:#bff6ff}
.rail.sub .chip{height:32px;font-size:12px;font-weight:600;border-radius:999px;padding:0 12px}
.toggle{margin-inline-start:auto;flex:none}
.toggle[aria-pressed=true]{border-color:rgba(61,220,148,.55);background:rgba(61,220,148,.14);color:#c9ffe6}

.listhead{flex:none;display:flex;align-items:baseline;gap:10px;padding:14px clamp(14px,3vw,28px) 8px}
.listhead h2{margin:0;font-size:16px;font-weight:800}
.listhead span{font-size:12px;color:var(--muted)}

.list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px clamp(14px,3vw,28px) 24px;scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent;scroll-padding-top:8px}
.list::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:2px solid var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 16px;border:1px dashed var(--line-strong);border-radius:var(--radius)}
.foot{flex:none;display:flex;justify-content:space-between;gap:12px;padding:7px clamp(14px,3vw,28px);border-top:1px solid var(--line);font-size:11px;color:var(--faint);background:rgba(7,12,24,.72)}

/* ---------- الكارت ---------- */
.card{--accent:#7c8cff;position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface));overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;content-visibility:auto;contain-intrinsic-size:auto 190px}
.card::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent);opacity:.9}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.c-top{display:flex;gap:12px;align-items:flex-start}
.c-icon{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.c-icon img{width:26px;height:26px;object-fit:contain}
.c-title{min-width:0;flex:1}
.c-title h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-title small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-desc{margin:0;font-size:12.5px;line-height:1.7;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(150,172,214,.10);color:var(--muted);border:1px solid var(--line)}
.tag.accent{color:color-mix(in srgb,var(--accent) 75%,#fff);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tag.ok{color:#b8ffdd;background:rgba(61,220,148,.12);border-color:rgba(61,220,148,.35)}
.c-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-3);font-size:13px;font-weight:700;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--brand);background:#20305a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{flex:1;border:0;color:var(--brand-ink);background:linear-gradient(135deg,#3ddcf0,#5fe9c0);box-shadow:0 6px 16px rgba(61,220,240,.20)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(135deg,#3ddcf0,#5fe9c0)}
.btn.wide{flex:1}
.btn.sq{width:40px;padding:0;flex:none}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- نافذة الجسر ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(3,7,16,.72);backdrop-filter:blur(6px)}
.sheet{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:20px;border:1px solid var(--line-strong);background:linear-gradient(180deg,#14203a,#0d1526);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:20px;display:grid;gap:14px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head .mark{width:44px;height:44px}
.sheet-head h2{margin:0;font-size:17px;font-weight:800}
.sheet-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.x{margin-inline-start:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.note{font-size:13px;line-height:1.8;color:#c3d0e6;margin:0}
.note.small{font-size:12px;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:#c3d0e6}
.field input[type=text],.field input[type=password]{height:46px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px;font-size:15px;direction:ltr;text-align:left}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,220,240,.14)}
.row2{display:grid;grid-template-columns:1fr 130px;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:#c3d0e6}
.check input{width:18px;height:18px;accent-color:#3ddcf0}
.btns{display:flex;gap:10px}
.btns .btn{flex:1;height:46px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--faint);font-size:13.5px;font-weight:700;transition:.2s}
.step .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:12px;color:transparent}
.step em{margin-inline-start:auto;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600;direction:ltr}
.step.active{color:var(--text);border-color:rgba(61,220,240,.5);background:rgba(61,220,240,.07)}
.step.active .dot{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:#b8ffdd}
.step.done .dot{background:var(--good);border-color:var(--good);color:#04221a}
.bar{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3ddcf0,#6d7bff);transition:width .25s}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.barlbl b{color:var(--text);direction:ltr}
.term{min-height:86px;max-height:120px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;border-radius:12px;background:#050a14;border:1px solid var(--line);font:12px/1.7 ui-monospace,Consolas,monospace;direction:ltr;text-align:left;color:#7fe9c9}
.term div.dim{color:#6d7f9c}
.term div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result{display:grid;gap:12px;text-align:center;justify-items:center;padding:8px 0}
.result .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px}
.result.ok .big{background:rgba(61,220,148,.15);color:var(--good);border:2px solid rgba(61,220,148,.5)}
.result.bad .big{background:rgba(255,107,122,.12);color:var(--bad);border:2px solid rgba(255,107,122,.45)}
.result h3{margin:0;font-size:17px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3ddcf0,#6d7bff);color:#04121f;font-weight:800}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;font-size:12.5px;color:var(--muted)}
.wait .sp{width:16px;height:16px;border:2px solid rgba(61,220,240,.25);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}

.loading{height:100vh;height:100dvh;display:grid;place-items:center;text-align:center;color:#b8c8e2;font-size:15px}
.spinner{width:26px;height:26px;border:3px solid rgba(61,220,240,.2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;z-index:80;background:#10304a;border:1px solid rgba(61,220,240,.35);color:#d2fbff;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;transition:.2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.error-boundary-screen{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.error-boundary-screen>div{max-width:520px;padding:28px;border:1px solid var(--line-strong);border-radius:20px;background:var(--surface)}
.error-boundary-screen button{border:0;border-radius:999px;padding:10px 20px;background:var(--brand);color:var(--brand-ink);font-weight:800}

@media (max-width:700px){
  .brand p{display:none}
  .pill span.lbl{display:none}
  .pill{padding:0 11px}
  .grid{grid-template-columns:1fr;gap:12px}
  .foot span:nth-child(2){display:none}
  .row2{grid-template-columns:1fr}
  .sheet{padding:16px}
}
@media (max-height:620px){.rail.sub{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.search .ico svg{width:19px;height:19px}
.c-desc .src{color:#b4c3de;font-weight:600}
.btn.primary.off{background:var(--surface-3);color:var(--muted);box-shadow:none;border:1px dashed var(--line-strong);cursor:help}.btn.primary.off:hover{filter:none;background:var(--surface-3)}
  </style>
</head>
<body>
  <div id="root"><div class="loading"><div><div class="spinner"></div>جاري تجهيز مركز التحكم...</div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const {useState,useEffect,useMemo,useCallback,useRef} = React;

    /* ---------- الجسر ---------- */
    const BRIDGE = "http://127.0.0.1:8765";
    const EXE_URL = "https://github.com/online4tech/online4Tech/releases/download/bridge-latest/O4T-Bridge.exe";
    const PROFILE_KEY = "online4tech-ssh-profile-v1";   /* نفس مفتاح AllBlugin و Enigma2 Manager */
    const SEEN_KEY = "o4t-bridge-seen";
    const SOFT_RE = /cccam|oscam|\bncam|mgcamd|camd3|gcam|newcamd|gbox|softcam|emulator|card[-_ ]?shar|\bc[-_ ]?line\b|keys?[-_ ]?updater|constant[-_ ]?cw/i;
    const store = {
      get(k){try{return localStorage.getItem(k)}catch(e){return null}},
      set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
    };

    /* نفس قواعد الجسر (للعرض بس): الجسر بيتحقق بنفسه ومش بيصدّق الصفحة. */
    function bridgeSupport(item){
      const cmd = item.installCommand || "";
      if(!cmd || item.commandIndex == null || item.commandIndex < 0) return {ok:false,reason:"مفيش أمر متاح للعنصر ده"};
      if(SOFT_RE.test([item.name,cmd,item.commandSource,item.sectionId].join(" "))) return {ok:false,reason:"النوع ده مش مدعوم في الجسر"};
      const flat = cmd.trim().replace(/\s+/g," ");
      if(flat==="opkg install /tmp/*.ipk" || flat==="rm -rf /var/cache/opkg/* && opkg update" || /^opkg install [a-z0-9][a-z0-9+._-]{0,63}$/.test(flat)) return {ok:true,reason:""};
      if(/[;&$`<>(){}\\]/.test(cmd)) return {ok:false,reason:"الأمر مركّب ومش مدعوم في الجسر"};
      const t = cmd.replace(/"/g,"").trim().split(/\s+/);
      const urls = t.filter(x=>/^https?:\/\//.test(x));
      if(t[0] !== "wget" || t[t.length-2] !== "|" || !/^(\/bin\/)?(sh|bash)$/.test(t[t.length-1]) || urls.length !== 1) return {ok:false,reason:"شكل الأمر مش مدعوم في الجسر"};
      let u; try{u = new URL(urls[0]);}catch(e){return {ok:false,reason:"رابط غير صالح"};}
      if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(u.hostname) || /^\d+(\.\d+){3}$/.test(u.hostname)) return {ok:false,reason:"رابط المصدر غير مدعوم"};
      return {ok:true,reason:"",insecure:u.protocol !== "https:"};
    }

    async function bridgeHealth(ms){
      const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), ms || 1500);
      try{
        const r = await fetch(BRIDGE+"/health",{cache:"no-store",signal:ctl.signal});
        if(!r.ok) return null;
        const j = await r.json();
        return j && j.ok ? j : null;
      }catch(e){return null}finally{clearTimeout(t)}
    }
    const canInstallCommands = h => !!(h && Array.isArray(h.capabilities) && h.capabilities.includes("install-command"));
    async function lnaState(){
      try{return (await navigator.permissions.query({name:"local-network-access"})).state}catch(e){return "unknown"}
    }
    const LNA_DENIED = "المتصفح مانع اتصال الصفحة بالجسر. اضغط على أيقونة القفل جنب عنوان الموقع، افتح «إعدادات الموقع» وفعّل «الأجهزة على الشبكة المحلية» (Local network access)، وبعدها حدّث الصفحة.";
    const sleep = ms => new Promise(r=>setTimeout(r,ms));
    function launchProtocol(){
      try{const f=document.createElement("iframe");f.style.display="none";f.src="o4tbridge://start";document.body.appendChild(f);setTimeout(()=>f.remove(),4000)}catch(e){}
    }
    const STEPS = [
      {ar:"جاري الاتصال بالجسر..."},
      {ar:"جاري تحميل الملفات اللازمة..."},
      {ar:"جاري تثبيت الأدوات..."}
    ];
    const STAGE_INDEX = {connect:0,download:1,install:2};

    function Icon({name}){
      const p = {
        download:"M12 3v12m0 0 4-4m-4 4-4-4M5 19h14",
        copy:"M9 9h10v11H9zM5 15V4h10",
        link:"M14 4h6v6m0-6-9 9M18 14v5H5V6h5",
        search:"M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm9 3-4.5-4.5",
        bolt:"M13 3 5 14h6l-1 7 8-11h-6z"
      }[name];
      return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={p}/></svg>;
    }

    /* ---------- نافذة التثبيت عبر الجسر ---------- */
    function InstallDialog({item,onClose}){
      const [view,setView] = useState("check");   /* check | setup | form | run | done | err | ready */
      const [setupMsg,setSetupMsg] = useState("");
      const [waitMsg,setWaitMsg] = useState("جاري فحص الجسر…");
      const [host,setHost] = useState("");
      const [user,setUser] = useState("root");
      const [pass,setPass] = useState("");
      const [restart,setRestart] = useState(true);
      const [step,setStep] = useState(0);
      const [stepNote,setStepNote] = useState("");
      const [pct,setPct] = useState(0);
      const [status,setStatus] = useState("");
      const [log,setLog] = useState([]);
      const [msg,setMsg] = useState("");
      const [errCode,setErrCode] = useState("");
      const [errLines,setErrLines] = useState([]);
      const session = useRef(0), poll = useRef(null), abort = useRef(null), hostRef = useRef(null), passRef = useRef(null);
      const viewRef = useRef("check"); viewRef.current = view;

      const toast = showToast;
      const stop = () => {session.current++; clearInterval(poll.current); if(abort.current){try{abort.current.abort()}catch(e){} abort.current=null;}};
      const close = () => {stop(); onClose();};

      function showSetup(m,w){setSetupMsg(m||""); setWaitMsg(w||"في انتظار تشغيل الجسر…"); setView("setup");}
      function showForm(){
        clearInterval(poll.current); store.set(SEEN_KEY,"1");
        if(!item){setView("ready"); return;}
        try{
          const saved = JSON.parse(store.get(PROFILE_KEY)||"{}");
          if(typeof saved.bridgeHost==="string") setHost(h=>h||saved.bridgeHost);
          if(typeof saved.bridgeUser==="string" && saved.bridgeUser) setUser(saved.bridgeUser);
          if(saved.rememberPassword===true && typeof saved.password==="string") setPass(p=>p||saved.password);
        }catch(e){}
        setView("form");
      }
      function waitForBridge(my){
        clearInterval(poll.current);
        poll.current = setInterval(async()=>{
          if(my!==session.current){clearInterval(poll.current);return}
          if(await lnaState()==="denied"){clearInterval(poll.current);showSetup(LNA_DENIED);return}
          const h = await bridgeHealth();
          if(my!==session.current) return;
          if(canInstallCommands(h)){clearInterval(poll.current);showForm();return}
          if(await lnaState()==="prompt") setWaitMsg("في انتظار تشغيل الجسر… ولو المتصفح سأل عن الشبكة المحلية اضغط «سماح»");
        },1500);
      }
      async function ensureBridge(my){
        const st = await lnaState();
        if(my!==session.current) return;
        if(st==="denied"){showSetup(LNA_DENIED);return}
        if(st!=="granted") setWaitMsg("لو ظهرت رسالة من المتصفح عن الشبكة المحلية اضغط «سماح»…");
        let h = await bridgeHealth(st==="granted"?1500:60000);
        if(my!==session.current) return;
        if(canInstallCommands(h)) return showForm();
        if(h){
          showSetup("الجسر شغال على جهازك لكن نسخته قديمة ومش بتدعم تثبيت أوامر المركز. نزّل النسخة الجديدة من الزر تحت وشغّلها (هتحل محل القديمة)، وهنكمل لوحدنا.","الجسر الحالي نسخة قديمة (v"+(h.version||"?")+") — في انتظار النسخة الجديدة…");
          return waitForBridge(my);
        }
        if(store.get(SEEN_KEY)==="1"){
          setWaitMsg("جاري تشغيل الجسر…"); setView("setup"); launchProtocol();
          for(let i=0;i<8;i++){
            await sleep(750); if(my!==session.current) return;
            h = await bridgeHealth(); if(canInstallCommands(h)) return showForm();
          }
        }
        showSetup(); waitForBridge(my);
      }
      useEffect(()=>{ const my=++session.current; ensureBridge(my); return stop; },[]);
      useEffect(()=>{
        if(view==="form"){ const el = host ? passRef.current : hostRef.current; el && el.focus(); }
      },[view]);
      useEffect(()=>{
        const onKey = e=>{ if(e.key==="Escape" && viewRef.current!=="run"){e.preventDefault(); close();} };
        document.addEventListener("keydown",onKey); return ()=>document.removeEventListener("keydown",onKey);
      },[]);

      function rememberProfile(h,u){
        try{
          const saved = JSON.parse(store.get(PROFILE_KEY)||"{}");
          saved.bridgeHost=h; saved.bridgeUser=u; if(!saved.bridgePort) saved.bridgePort="22";
          store.set(PROFILE_KEY,JSON.stringify(saved));
        }catch(e){}
      }
      function fail(m,code,lines){setMsg(m||"حصل خطأ."); setErrCode(code||""); setErrLines((lines||[]).slice(-4)); setView("err");}

      async function run(forget){
        const my = ++session.current;
        const h = host.trim(), u = user.trim() || "root";
        if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(h)){toast("اكتب IP الرسيفر بشكل صحيح، مثال: 192.168.1.120"); setView("form"); return}
        if(!pass){toast("اكتب كلمة مرور الرسيفر."); setView("form"); return}
        rememberProfile(h,u);
        setLog([]); setStep(0); setStepNote(""); setPct(0); setStatus("جاري الاتصال بالجسر…"); setView("run");
        const lines = []; let finished=false, got=false;
        abort.current = new AbortController();
        try{
          const resp = await fetch(BRIDGE+"/install",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",signal:abort.current.signal,
            body:JSON.stringify({source:"center",index:item.commandIndex,name:item.commandName,host:h,port:22,username:u,password:pass,restart_gui:restart,forget_host_key:!!forget})});
          if(!resp.ok){let m="";try{m=(await resp.json()).error}catch(e){} throw new Error(m||("خطأ من الجسر (HTTP "+resp.status+")"));}
          const reader = resp.body.getReader(), dec = new TextDecoder(); let buf="";
          for(;;){
            const {value,done} = await reader.read();
            if(my!==session.current) return;
            if(done) break;
            buf += dec.decode(value,{stream:true});
            let nl;
            while((nl=buf.indexOf("\n"))>=0){
              const line = buf.slice(0,nl).trim(); buf = buf.slice(nl+1);
              if(!line) continue;
              let ev; try{ev=JSON.parse(line)}catch(e){continue}
              got = true;
              if(ev.event==="stage"){
                const idx = STAGE_INDEX[ev.stage];
                if(idx!==undefined){ setStep(idx); if(idx===1 && /MB|\//.test(ev.msg||"")) setStepNote(ev.msg); }
                if(typeof ev.pct==="number") setPct(Math.max(0,Math.min(100,ev.pct)));
                if(ev.msg) setStatus(ev.msg);
              }else if(ev.event==="log"){
                lines.push(ev.line); if(lines.length>6) lines.shift();
                setLog(l=>[...l.slice(-4),ev.line]);
              }else if(ev.event==="done"){
                finished=true; setStep(3); setPct(100); setMsg(ev.msg||"تم التثبيت بنجاح."); setView("done");
              }else if(ev.event==="error"){
                finished=true; fail(ev.msg,ev.code,lines);
              }
            }
          }
          if(!finished && my===session.current) fail("انقطع الاتصال بالجسر قبل ما التثبيت يخلص.","",lines);
        }catch(e){
          if(my!==session.current || (e && e.name==="AbortError")) return;
          if(!got){
            const hh = await bridgeHealth();
            if(!canInstallCommands(hh)){showSetup("الجسر مش شغال دلوقتي. شغّله وهنكمل."); waitForBridge(my); return}
          }
          fail(e && e.message ? e.message : "حصل خطأ غير متوقع.","",lines);
        }
      }

      const title = item ? item.name : "الجسر";
      return <div className="modal" role="dialog" aria-modal="true" aria-label="جسر التثبيت" onMouseDown={e=>{if(e.target===e.currentTarget && view!=="run") close();}}>
        <div className="sheet">
          <div className="sheet-head">
            <span className="mark">O4T</span>
            <div><h2>جسر التثبيت</h2><p>{item ? title : "فحص الاتصال بالجسر"}</p></div>
            {view!=="run" && <button className="x" onClick={close} aria-label="إغلاق">×</button>}
          </div>

          {view==="check" && <><div className="wait"><span className="sp"></span>{waitMsg}</div></>}

          {view==="setup" && <>
            <p className="note">{setupMsg || "عشان تثبّت من المتصفح محتاج برنامج الجسر شغال على الكمبيوتر (ويندوز). نزّله مرة واحدة، شغّله، وهنكمل تلقائي."}</p>
            <a className="dl" href={EXE_URL} target="_blank" rel="noopener noreferrer"><Icon name="download"/> تحميل O4T-Bridge.exe</a>
            <div className="wait"><span className="sp"></span>{waitMsg}</div>
            <div className="btns"><button className="btn" onClick={close}>إلغاء</button></div>
          </>}

          {view==="ready" && <div className="result ok"><div className="big">✓</div><h3>الجسر شغال</h3><p className="note small">تقدر تضغط «تثبيت» على أي كارت متاح.</p><button className="btn primary" onClick={close}>تمام</button></div>}

          {view==="form" && <form onSubmit={e=>{e.preventDefault();run(false)}} style={{display:"grid",gap:14}}>
            <p className="note">اكتب بيانات الرسيفر وهنكمل التثبيت لوحدنا.</p>
            {item && bridgeSupport(item).insecure && <p className="note small">⚠ مصدر السكربت ده بيستخدم http غير مشفّر. كمّل بس لو واثق في المصدر.</p>}
            <div className="row2">
              <div className="field"><label htmlFor="cc-host">IP الرسيفر</label><input id="cc-host" ref={hostRef} type="text" inputMode="decimal" autoComplete="off" placeholder="192.168.1.120" value={host} onChange={e=>setHost(e.target.value)}/></div>
              <div className="field"><label htmlFor="cc-user">المستخدم</label><input id="cc-user" type="text" autoComplete="off" value={user} onChange={e=>setUser(e.target.value)}/></div>
            </div>
            <div className="field"><label htmlFor="cc-pass">كلمة مرور الرسيفر</label><input id="cc-pass" ref={passRef} type="password" autoComplete="off" value={pass} onChange={e=>setPass(e.target.value)}/></div>
            <label className="check"><input type="checkbox" checked={restart} onChange={e=>setRestart(e.target.checked)}/> أعد تشغيل واجهة الرسيفر بعد التثبيت</label>
            <div className="btns"><button type="button" className="btn" onClick={close}>إلغاء</button><button type="submit" className="btn primary"><Icon name="bolt"/> ابدأ التثبيت</button></div>
          </form>}

          {view==="run" && <>
            <ul className="steps">{STEPS.map((s,i)=><li key={i} className={"step "+(i<step?"done":i===step?"active":"")}><span className="dot">✓</span>{s.ar}{i===1 && stepNote && <em>{stepNote}</em>}</li>)}</ul>
            <div><div className="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.floor(pct)}><i style={{width:pct+"%"}}></i></div>
              <div className="barlbl" style={{marginTop:6}}><span>{status}</span><b>{Math.floor(pct)}%</b></div></div>
            <div className="term" aria-live="off">{log.map((l,i)=><div key={i} className={/^(\$|GET )/.test(l)?"":"dim"}>{l}</div>)}</div>
            <button className="btn" onClick={()=>{close(); toast("تم الإلغاء. لو التثبيت بدأ على الرسيفر ممكن يكمل لوحده.");}}>إلغاء المتابعة</button>
          </>}

          {view==="done" && <div className="result ok"><div className="big">✓</div><h3>{msg}</h3><button className="btn primary" style={{width:"100%"}} onClick={close}>تمام</button></div>}

          {view==="err" && <div className="result bad"><div className="big">!</div><h3>{msg}</h3>
            {errLines.length>0 && <div className="term" style={{width:"100%"}}>{errLines.map((l,i)=><div key={i} className="dim">{l}</div>)}</div>}
            <div className="btns" style={{width:"100%"}}>
              <button className="btn" onClick={close}>إغلاق</button>
              {errCode==="host_key_changed" ? <button className="btn primary" onClick={()=>run(true)}>أنا غيّرت الصورة، كمّل</button> : <button className="btn primary" onClick={()=>setView("form")}>جرّب تاني</button>}
            </div>
          </div>}
        </div>
      </div>;
    }

    const DATA_BASE = "./data/enigma2/";
    const FALLBACK_ICON = "◈";

    function safeText(value, fallback="غير متاح في بيانات الفهرس"){
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }
    function normalizeItem(raw, group, section, index){
      const object = raw && typeof raw === "object" && !Array.isArray(raw);
      const name = object ? (raw.name || raw.title || raw.label || raw.id) : raw;
      return {
        id: object && raw.id ? String(raw.id) : [group.id,section.id,index,String(name)].join("-"),
        name: safeText(String(name ?? "عنصر بدون اسم"),"عنصر بدون اسم"),
        icon: object && typeof raw.icon === "string" ? raw.icon : "",
        url: object ? (raw.url || raw.link || raw.website || raw.downloadUrl || "") : "",
        groupId: group.id,
        groupTitle: group.title,
        groupIcon: group.icon || FALLBACK_ICON,
        groupDescription: group.description || "",
        sectionId: section.id,
        sectionTitle: section.title || section.name || section.id,
        sectionIcon: section.icon || group.icon || FALLBACK_ICON,
        description: object ? (raw.description || raw.summary || "") : "",
        path: object ? (raw.path || raw.file || "") : "",
        installCommand: object ? (raw.installCommand || raw.install_command || raw.command || "") : "",
        installNotes: object ? (raw.installNotes || raw.install_notes || raw.installNote || raw.install_note || "") : "",
        commandVerified: object ? !!(raw.installCommand || raw.install_command || raw.command) : false,
        updateCommand: object ? (raw.updateCommand || raw.update_command || "") : "",
        removeCommand: object ? (raw.removeCommand || raw.remove_command || "") : "",
        removeNotes: object ? (raw.removeNotes || raw.remove_notes || raw.removeNote || raw.remove_note || "") : "",
        status: object ? (raw.status || "") : ""
      };
    }
    function normalizeData(raw){
      const groups = Array.isArray(raw?.groups) ? raw.groups : [];
      const items = [];
      groups.forEach(group => {
        (Array.isArray(group.sections) ? group.sections : []).forEach(section => {
          (Array.isArray(section.items) ? section.items : []).forEach((item,index) => {
            items.push(normalizeItem(item,group,section,index));
          });
        });
      });
      return {groups,items};
    }

    async function loadCatalog(){
      const [catalogResponse,itemsResponse,commandsResponse] = await Promise.all([
        fetch(DATA_BASE+"catalog.json",{cache:"no-cache"}),
        fetch(DATA_BASE+"items.json.gz",{cache:"no-cache"}),
        fetch(DATA_BASE+"commands.json",{cache:"no-cache"})
      ]);
      if(!catalogResponse.ok) throw new Error("تعذر تحميل catalog.json");
      if(!itemsResponse.ok) throw new Error("تعذر تحميل ملف العناصر");
      if(!commandsResponse.ok) throw new Error("تعذر تحميل ملف الأوامر");
      const catalog = await catalogResponse.json();
      const commandsData = await commandsResponse.json();
      let payload;
      if("DecompressionStream" in window){
        const compressed = await itemsResponse.arrayBuffer();
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
        payload = JSON.parse(await new Response(stream).text());
      } else {
        throw new Error("المتصفح الحالي لا يدعم قراءة ملف الفهرس المضغوط");
      }
      const normalized = normalizeData(payload);
      const commandRecords = Array.isArray(commandsData.records) ? commandsData.records : [];
      const cleanKey = value => String(value || "").trim().toLocaleLowerCase().replace(/[\\s_-]+/g,"");
      const metadata = new Map((catalog.groups || []).map(g=>[g.id,g]));
      normalized.groups = normalized.groups.map(g=>({...metadata.get(g.id),...g,icon:g.icon || metadata.get(g.id)?.icon || FALLBACK_ICON}));
      normalized.items = normalized.items.map(item => {
        const sameName = commandRecords.filter(record => cleanKey(record.name) === cleanKey(item.name));
        let matches = sameName.filter(record => cleanKey(record.path) === cleanKey(item.path));
        if (matches.length > 1) {
          const sectionMatches = matches.filter(record => cleanKey(record.sourceSection) === cleanKey(item.sectionId));
          if (sectionMatches.length) matches = sectionMatches;
        }
        if (matches.length !== 1) {
          const sectionMatches = sameName.filter(record => cleanKey(record.sourceSection) === cleanKey(item.sectionId));
          if (sectionMatches.length === 1) matches = sectionMatches;
        }
        if (matches.length !== 1) return item;
        const record = matches[0];
        return {...item,commandIndex:commandRecords.indexOf(record),commandName:record.name || "",installCommand:record.cmd || "",removeCommand:record.remove_cmd || "",installNotes:item.installNotes || record.installNotes || record.install_notes || record.install_note || "",removeNotes:item.removeNotes || record.removeNotes || record.remove_notes || record.remove_note || "",commandSource:record.sourceSection,commandAvailable:!!record.cmd};
      });
      return {...normalized,catalog,commandStats:{sourceRecords:commandRecords.length,matched:normalized.items.filter(item=>item.installCommand).length}};
    }


    function getCategoryIcon(category){
      const key=String(category || "").toLocaleLowerCase();
      if(/channel|قنوات|قائمة|قمر|satellite/.test(key)) return "assets/icons/satellite.svg";
      if(/subtitle|ترجم|subs/.test(key)) return "assets/icons/subtitle.svg";
      if(/tv|تلفزيون|بث|live|قنوات/.test(key)) return "assets/icons/tv.svg";
      if(/movie|film|فيلم|وسائط|media|video/.test(key)) return "assets/icons/movie.svg";
      if(/backup|نسخ|استعاد|image|صور النظام/.test(key)) return "assets/icons/backup.svg";
      if(/picon|بيكون|شعار/.test(key)) return "assets/icons/picons.svg";
      if(/skin|ثيم|واجهة/.test(key)) return "assets/icons/skin.svg";
      if(/boot|إقلاع|بوت/.test(key)) return "assets/icons/bootlogo.svg";
      if(/tool|system|أدوات|نظام|إدارة|صيانة|إعداد/.test(key)) return "assets/icons/settings.svg";
      return "assets/icons/tools.svg";
    }
    function categoryTheme(item){
      const key=[item.groupId,item.groupTitle,item.sectionId,item.sectionTitle,item.name].join(" ").toLocaleLowerCase();
      if(/channel|قنوات|القنوات/.test(key)) return "theme-channels";
      if(/media|وسائط|فيديو|صوت/.test(key)) return "theme-media";
      if(/skin|واجهة|سكين/.test(key)) return "theme-skins";
      if(/picon|بيكون|شعار/.test(key)) return "theme-picons";
      if(/bootlogo|بوت|إقلاع/.test(key)) return "theme-bootlogos";
      if(/system|نظام|تحديث|إدارة/.test(key)) return "theme-system";
      return "theme-plugins";
    }

    function splitName(name){
      const m = /^(.*?)\s*\((.+)\)\s*$/.exec(name);
      if(!m) return {title:name,sub:""};
      const [,a,b] = m;
      if(/[A-Za-z]/.test(a) || !/[A-Za-z]/.test(b)) return {title:a,sub:b};
      return {title:b,sub:a};
    }
    const THEME_COLOR = {"theme-plugins":"#7c8cff","theme-channels":"#3ddc97","theme-media":"#ff9f5a","theme-skins":"#c084fc","theme-picons":"#38bdf8","theme-bootlogos":"#f472b6","theme-system":"#fbbf24"};

    function sourceLine(text){
      const m = /https?:\/\/([^\/\s"']+)\/?([^\/\s"']*)/.exec(text || "");
      if(!m) return null;
      const owner = /github/.test(m[1]) ? m[2] : "";
      return {host:m[1].replace(/^raw\./,""), owner};
    }
    const Card = React.memo(function Card({item,support,onInstall,onCopy}){
      const {title,sub} = splitName(item.name);
      const accent = THEME_COLOR[categoryTheme(item)];
      const src = sourceLine(item.installCommand || item.url);
      return <article className="card" style={{"--accent":accent}}>
        <div className="c-top">
          <span className="c-icon"><img src={item.icon || getCategoryIcon(item.sectionId+" "+item.sectionTitle+" "+item.groupId)} alt="" loading="lazy" onError={e=>{e.currentTarget.onerror=null;e.currentTarget.src=getCategoryIcon(item.groupId+" "+item.groupTitle);}}/></span>
          <div className="c-title"><h3 title={item.name}>{title}</h3>{sub && <small>{sub}</small>}</div>
        </div>
        {item.description ? <p className="c-desc">{item.description}</p> : src && <p className="c-desc">المصدر: <bdi dir="ltr" className="src">{src.host}{src.owner ? " / "+src.owner : ""}</bdi></p>}
        <div className="c-tags">
          <span className="tag accent">{item.sectionTitle || item.groupTitle || "عام"}</span>
          {support.ok ? <span className="tag ok">● تثبيت من المتصفح</span> : item.installCommand ? <span className="tag" title={support.reason}>نسخ فقط · {support.reason}</span> : <span className="tag">بدون أمر</span>}
        </div>
        <div className="c-actions">
          <button className={"btn primary"+(support.ok?"":" off")} aria-disabled={!support.ok} title={support.ok?"تثبيت تلقائي عبر الجسر":support.reason} onClick={()=>support.ok?onInstall(item):showToast("التثبيت التلقائي غير متاح: "+support.reason+" — تقدر تنسخ الأمر.")}><Icon name="download"/> {support.ok?"تثبيت تلقائي":"غير متاح"}</button>
          <button className="btn sq" title={item.installCommand?"نسخ الأمر":"مفيش أمر متاح"} aria-label={"نسخ أمر "+item.name} disabled={!item.installCommand} onClick={()=>onCopy(item.installCommand)}><Icon name="copy"/></button>
          {item.url && <a className="btn sq" href={item.url} target="_blank" rel="noopener noreferrer" title="فتح الرابط" aria-label={"فتح رابط "+item.name}><Icon name="link"/></a>}
        </div>
      </article>;
    });

    function App(){
      const [dataset,setDataset] = useState(null);
      const [error,setError] = useState("");
      const [category,setCategory] = useState("");
      const [section,setSection] = useState("");
      const [query,setQuery] = useState("");
      const [onlyInstall,setOnlyInstall] = useState(false);
      const [dialog,setDialog] = useState(null);     /* {item} | {item:null} */
      const [bridgeState,setBridgeState] = useState("unknown");
      const listRef = useRef(null);

      useEffect(()=>{loadCatalog().then(data=>{
        setDataset(data);
        setCategory(data.groups[0]?.id || "");
      }).catch(e=>setError(e.message));},[]);

      /* نفحص الجسر بصمت بس لو المتصفح سامح بالفعل (عشان منطلعش رسالة صلاحيات من غير ضغطة) */
      useEffect(()=>{
        let alive = true;
        (async()=>{
          if(await lnaState() !== "granted") return;
          const h = await bridgeHealth(1200);
          if(alive) setBridgeState(canInstallCommands(h) ? "online" : "offline");
        })();
        return ()=>{alive=false};
      },[dialog]);

      const groups = dataset?.groups || [];
      const items = dataset?.items || [];
      const support = useMemo(()=>new Map(items.map(i=>[i.id,bridgeSupport(i)])),[items]);
      const counts = useMemo(()=>{const m=new Map();items.forEach(i=>m.set(i.groupId,(m.get(i.groupId)||0)+1));return m;},[items]);
      const sections = useMemo(()=>{
        const m = new Map();
        items.filter(i=>i.groupId===category).forEach(i=>{
          if(!m.has(i.sectionId)) m.set(i.sectionId,{id:i.sectionId,title:i.sectionTitle,count:0});
          m.get(i.sectionId).count++;
        });
        return [...m.values()];
      },[items,category]);
      const q = query.trim().toLocaleLowerCase();
      const filtered = useMemo(()=>items.filter(i=>
        (q || !category || i.groupId===category) &&
        (q || !section || i.sectionId===section) &&
        (!onlyInstall || support.get(i.id)?.ok) &&
        (!q || [i.name,i.groupTitle,i.sectionTitle,i.description].join(" ").toLocaleLowerCase().includes(q))
      ),[items,category,section,q,onlyInstall,support]);
      const installable = useMemo(()=>filtered.filter(i=>support.get(i.id)?.ok).length,[filtered,support]);
      const activeGroup = groups.find(g=>g.id===category);
      const heading = q ? "نتائج البحث" : (section ? (sections.find(s=>s.id===section)?.title || "العناصر") : (activeGroup?.title || "كل العناصر"));

      useEffect(()=>{ if(listRef.current) listRef.current.scrollTop = 0; },[category,section,q,onlyInstall]);

      const copy = useCallback(async cmd=>{
        if(!cmd) return;
        try{await navigator.clipboard.writeText(cmd); showToast("تم نسخ الأمر");}
        catch(e){showToast("تعذر النسخ من المتصفح");}
      },[]);
      const openInstall = useCallback(item=>setDialog({item}),[]);

      if(error) return <div className="loading"><div>تعذر تحميل المركز: {error}<br/><small>حدّث الصفحة وحاول مرة تانية.</small></div></div>;
      if(!dataset) return <div className="loading"><div><div className="spinner"></div>جاري تجهيز مركز التحكم...</div></div>;

      return <div className="app">
        <header className="top">
          <div className="brand">
            <span className="mark">O4T</span>
            <div><h1>مركز التحكم <em>الذكي</em></h1><p>كل أدوات Enigma2 في منصة واحدة</p></div>
          </div>
          <div className="top-actions">
            <button className="pill" data-state={bridgeState} onClick={()=>setDialog({item:null})} title="فحص الاتصال بالجسر"><i></i><span className="lbl">{bridgeState==="online"?"الجسر شغال":bridgeState==="offline"?"الجسر غير متصل":"جسر التثبيت"}</span></button>
            <a className="pill" href="index.html">الرئيسية</a>
          </div>
        </header>

        <section className="controls" aria-label="البحث والتصنيفات">
          <div className="search">
            <span className="ico"><Icon name="search"/></span>
            <label className="sr" htmlFor="q">بحث</label>
            <input id="q" value={query} onChange={e=>setQuery(e.target.value)} placeholder="ابحث في كل الإضافات والتصنيفات..." autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}/>
            {query && <button className="clear" onClick={()=>setQuery("")} aria-label="مسح البحث">×</button>}
          </div>
          <nav className="rail" aria-label="الأقسام الرئيسية">
            {groups.map(g=><button key={g.id} className="chip" aria-pressed={!q && category===g.id} onClick={()=>{setCategory(g.id);setSection("");setQuery("");}}>
              <img src={getCategoryIcon(g.id+" "+g.title)} alt="" loading="lazy"/>{g.title || g.id}<b>{(counts.get(g.id)||0).toLocaleString("ar-EG")}</b>
            </button>)}
          </nav>
          <div className="rail sub" role="group" aria-label="التصنيفات الفرعية">
            {!q && <button className="chip" aria-pressed={!section} onClick={()=>setSection("")}>الكل</button>}
            {!q && sections.map(s=><button key={s.id} className="chip" aria-pressed={section===s.id} onClick={()=>setSection(s.id)}>{s.title}<b>{s.count.toLocaleString("ar-EG")}</b></button>)}
            <button className="chip toggle" aria-pressed={onlyInstall} onClick={()=>setOnlyInstall(v=>!v)}>● المتاح للتثبيت فقط</button>
          </div>
        </section>

        <div className="listhead"><h2>{heading}</h2><span>{filtered.length.toLocaleString("ar-EG")} عنصر · {installable.toLocaleString("ar-EG")} قابل للتثبيت من المتصفح</span></div>
        <main className="list" ref={listRef} tabIndex={-1}>
          <div className="grid">
            {filtered.length ? filtered.map(i=><Card key={i.id} item={i} support={support.get(i.id)} onInstall={openInstall} onCopy={copy}/>) : <div className="empty">مفيش عناصر مطابقة للبحث أو التصنيف ده.</div>}
          </div>
        </main>
        <footer className="foot"><span>© Online4Tech</span><span>Enigma2 Control Center</span><span>التثبيت من المتصفح يحتاج الجسر (ويندوز)</span></footer>
        {dialog && <InstallDialog item={dialog.item} onClose={()=>setDialog(null)}/>}
      </div>;
    }

    function showToast(message){
      const el=document.getElementById("toast");if(!el)return;
      el.textContent=message;el.classList.add("show");
      clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
    }

    class AppErrorBoundary extends React.Component{
      constructor(props){super(props);this.state={hasError:false};}
      static getDerivedStateFromError(){return {hasError:true};}
      componentDidCatch(error,info){console.error("Online4Tech Control Center render error:",error,info);}
      render(){
        if(this.state.hasError)return <main className="error-boundary-screen"><div><h2>حصل خطأ غير متوقع في عرض المركز</h2><p>تقدر تعيد المحاولة من غير فقد بيانات الفهرس.</p><button onClick={()=>{this.setState({hasError:false});window.location.reload();}}>إعادة تحميل المركز</button></div></main>;
        return this.props.children;
      }
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App/></AppErrorBoundary>);
  </script>
</body>
</html>
